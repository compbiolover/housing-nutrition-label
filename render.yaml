# Render Blueprint for the Housing Nutrition Label API.
# Docs: https://render.com/docs/blueprint-spec
# Deploy: push this repo, then "New + → Blueprint" and select it.
# Scoring needs no API keys. The two optional keys only sharpen address
# autocomplete: GOOGLE_PLACES_API_KEY (best US business/landmark coverage) and
# GEOAPIFY_API_KEY (sharper US ranking). Without either, the keyless Photon
# geocoder is used. Both are sync:false so they aren't stored in the repo.
services:
  - type: web
    name: housing-label-api
    runtime: python
    # The running service is on Starter, and this file is the declared spec — left
    # saying "free" it invites a blueprint re-sync to reconcile the live service
    # back down to a tier that sleeps when idle.
    plan: starter
    buildCommand: pip install -e ".[api]"
    startCommand: housing-api          # reads $PORT, injected by Render
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://housinglabel.dev
      # Keep the glibc allocator from hoarding freed memory. A pandas/numpy request
      # path allocates and frees many short-lived buffers; by default glibc keeps
      # them in per-thread arenas and rarely returns them to the OS, so RSS ratchets
      # upward for days until the instance OOMs. Capping arenas and lowering the
      # trim threshold makes freed memory actually go back — flattening the climb.
      # Still needed on Starter: the tier buys a bigger box and no spin-down, not
      # an allocator that returns memory on its own.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      # Per-IP rate limit on the scoring endpoints (protects the keyed/free
      # upstreams they proxy). "" or "0" disables it; /healthz is always exempt.
      - key: RATE_LIMIT
        value: "30/minute"
      # Interactive HTTP budget for the upstream datasets. The library defaults
      # (60 s × 3 attempts, ~3 min for one stuck upstream) are tuned for batch
      # enrichment; a visitor watching a spinner would rather have one dimension
      # fall back to its estimate than wait that out. 12 s × 2 caps a single
      # upstream's contribution at ~26 s instead of ~186 s. The CLI and batch jobs
      # don't set these, so they keep the patient defaults.
      - key: HTTP_TIMEOUT
        value: "12"
      - key: HTTP_RETRIES
        value: "2"
      # Decode the bundled tract crosswalks at boot instead of inside the first
      # request after a deploy. Set to "0"/"off" from the dashboard to disable
      # without a code change if it ever costs more memory than it's worth.
      - key: WARMUP
        value: "1"
      # Optional address-autocomplete upgrades (else the keyless Photon geocoder).
      # Priority when set: Google Places → Geoapify → Photon. Enable "Places API
      # (New)" on the Google key. Both proxied server-side; visitors never see them.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
